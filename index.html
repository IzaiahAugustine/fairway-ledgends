<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fairway Legends</title>
    <script>
      // The game's home is golf.augustinesarcade.com. Anyone opening an older address (GitHub
      // Pages, the Firebase .web.app one) is forwarded there with their progress, which is saved
      // per site address, and any invite code.
      (function () {
        var h = location.hostname;
        if (!/github\.io$/.test(h) && !/^fairway-legends-51e70\.(web\.app|firebaseapp\.com)$/.test(h)) return;
        var to = 'https://golf.augustinesarcade.com/' + location.search;
        if (/^#transfer=/.test(location.hash)) to += location.hash;
        else
          try {
            var raw = localStorage.getItem('fairwayLegends.save.v1');
            if (raw) to += '#transfer=' + encodeURIComponent(btoa(unescape(encodeURIComponent(raw))));
          } catch (e) {}
        location.replace(to);
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%231f6f43%22/%3E%3Crect x=%2230%22 y=%2212%22 width=%223%22 height=%2236%22 fill=%22%23fff%22/%3E%3Cpath d=%22M33 12 L48 18 L33 24Z%22 fill=%22%23f2c14e%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
