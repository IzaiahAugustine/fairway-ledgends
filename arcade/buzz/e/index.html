<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event on Buzz</title>
<meta name="description" content="See this event on Buzz and get on the list.">
<!-- Event pages are made per link, so they stay out of search results. -->
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="You're invited · Buzz">
<meta property="og:description" content="See the event and get on the list.">
<meta property="og:image" content="https://augustinesarcade.com/buzz/img/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#05060B">
<link rel="icon" href="../img/buzz-neon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { width: min(520px, 100% - 32px); padding-top: 24px; }
  header { margin-bottom: 20px; }
  .event { background: var(--panel); border: 1px solid var(--edge); border-radius: 24px; overflow: hidden; }
  .flyer { position: relative; aspect-ratio: 4 / 3; background: linear-gradient(135deg, #2F6BFF, #FF5C8A); }
  .flyer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .flyer::after { content: ''; position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(180deg, transparent, var(--panel)); }
  .pill { position: absolute; top: 14px; left: 14px; z-index: 1; background: rgba(5, 6, 11, .72); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--glow); }
  .pill.bad { color: #FF6B5E; }
  .body { padding: 0 20px 22px; margin-top: -46px; position: relative; display: grid; gap: 12px; }
  .host { overflow-wrap: anywhere; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .event h1 { font-size: clamp(28px, 7vw, 36px); margin: 0; overflow-wrap: anywhere; }
  .facts { display: grid; gap: 4px; margin: 0; }
  .facts p { margin: 0; color: #D5DAE6; }
  .facts .price { font: 700 22px Outfit, sans-serif; color: var(--text); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: #1A1F2D; color: var(--muted); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
  .desc { margin: 0; white-space: pre-line; }
  .cta { display: block; text-align: center; text-decoration: none; font-weight: 800; font-size: 17px; color: #fff; background: var(--accent); border-radius: 16px; padding: 15px; box-shadow: 0 14px 34px -12px rgba(47, 107, 255, .95); }
  .cta.second { background: #1A1F2D; border: 1px solid var(--edge); box-shadow: none; font-weight: 700; }
  .fine { font-size: 13px; color: var(--muted); margin: 0; text-align: center; }
  .state { text-align: center; padding: 56px 20px; display: grid; gap: 10px; }
  .state h1 { font-size: 26px; margin: 0; }
  .state p { margin: 0; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <a href="../"><span class="dot"></span><b>Buzz</b></a>
</header>

<main>
  <div class="state" id="loading"><p>Loading the event…</p></div>

  <div class="event state" id="missing" hidden>
    <h1>This event isn&#39;t available</h1>
    <p>The link may be wrong, or the host made it invite only or took it down.</p>
    <p><a href="../">See what Buzz is</a></p>
  </div>

  <article class="event" id="event" hidden>
    <div class="flyer"><span class="pill" id="pill" hidden></span><img id="flyer" alt="" hidden></div>
    <div class="body">
      <p class="host" id="host"></p>
      <h1 id="title"></h1>
      <div class="facts">
        <p id="when"></p>
        <p class="price" id="price"></p>
        <p id="going"></p>
      </div>
      <div class="tags" id="tags"></div>
      <p class="desc" id="desc" hidden></p>
      <a class="cta" id="open" href="#">Get on the list</a>
      <a class="cta second" href="../#join">Get early access to the Buzz app</a>
      <p class="fine" id="fine"></p>
    </div>
  </article>
</main>

<footer>Buzz is 18+. <a href="../terms.html">Terms</a> · <a href="../privacy.html">Privacy</a> · <a href="../support.html">Help</a></footer>
</div>

<script>
  // The public, read-only event lookup on the Buzz backend. It only ever returns what anyone may see:
  // never an address, and nothing at all for invite-only events. (This is the dev stage; point it at prod at launch.)
  const API = 'https://qh42iq9itg.execute-api.us-east-2.amazonaws.com';
  // Buzz running in the browser (the same app, published from the buzz repo with `npm run web:deploy`).
  const APP = 'https://buzz-augustinesarcade.web.app';
  const $ = (id) => document.getElementById(id);
  const show = (id) => { for (const s of ['loading', 'missing', 'event']) $(s).hidden = s !== id; };

  const id = new URLSearchParams(location.search).get('id') || '';
  const looksLikeAnId = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

  function when(ev) {
    // Times are shown the way the host set them, in the event's own time zone.
    const day = new Intl.DateTimeFormat('en-US', { timeZone: ev.timeZone, weekday: 'long', month: 'short', day: 'numeric' });
    const time = new Intl.DateTimeFormat('en-US', { timeZone: ev.timeZone, hour: 'numeric', minute: '2-digit' });
    const zone = new Intl.DateTimeFormat('en-US', { timeZone: ev.timeZone, timeZoneName: 'short' }).formatToParts(new Date(ev.startsAt)).find((p) => p.type === 'timeZoneName');
    return `${day.format(new Date(ev.startsAt))} · ${time.format(new Date(ev.startsAt))} – ${time.format(new Date(ev.endsAt))}${zone ? ' ' + zone.value : ''}`;
  }

  function render(ev) {
    const now = Date.now(), starts = Date.parse(ev.startsAt), ends = Date.parse(ev.endsAt);
    const over = ends < now;
    // Everything from the server goes in as text, never as HTML.
    $('host').textContent = ev.orgName;
    $('title').textContent = ev.title;
    $('when').textContent = when(ev);
    $('price').textContent = ev.priceLabel;
    $('going').textContent = ev.goingCount > 0 ? `${ev.goingCount} going` : '';
    for (const t of ev.vibeTags || []) { const s = document.createElement('span'); s.textContent = t; $('tags').append(s); }
    if (ev.description) { $('desc').textContent = ev.description; $('desc').hidden = false; }
    if (typeof ev.flyerUrl === 'string' && ev.flyerUrl.startsWith('https://')) { $('flyer').src = ev.flyerUrl; $('flyer').hidden = false; }

    const status = ev.cancelled ? 'Cancelled' : over ? 'Ended' : starts <= now ? 'Live now' : ev.full ? 'Full' : '';
    if (status) { $('pill').textContent = status; $('pill').hidden = false; $('pill').classList.toggle('bad', ev.cancelled || over); }

    // Buzz in the browser: sign in with an email, then register and get a pass, no app needed.
    $('open').href = `${APP}/party/${encodeURIComponent(ev.id)}`;
    $('open').textContent = ev.visibility === 'OPEN' ? (ev.full ? 'Join the waitlist' : 'Get on the list') : 'Ask to come';
    if (ev.cancelled || over) $('open').hidden = true;
    $('fine').textContent = ev.cancelled ? 'This event was cancelled.'
      : over ? 'This event is over.'
      : ev.visibility === 'OPEN' ? 'Sign in with your email and you get your pass and the address right away. No app needed.'
      : 'Sign in with your email to ask. The host approves requests, then you get your pass and the address.';
    document.title = `${ev.title} · Buzz`;
    show('event');
  }

  if (!looksLikeAnId) show('missing');
  else fetch(`${API}/events/${id}`)
    .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
    .then(render)
    .catch(() => show('missing'));
</script>
</body>
</html>
